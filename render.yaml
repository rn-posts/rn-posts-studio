# Render Blueprint — rn-posts (Flask API + React frontend)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: rn-posts
    runtime: python
    plan: free
    buildCommand: npm ci && npm run build && pip install -r python-api/requirements.txt
    startCommand: cd python-api && gunicorn main:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NODE_VERSION
        value: "20"
      # Firebase — obrigatório no BUILD (Vite embute no JS). Preencha no painel Render:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
